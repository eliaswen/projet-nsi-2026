<script>
let secondesPassees=0;

function TempsPasse() {
  const zoneAffichage=document.getElementById("temps");

  setInterval(() => {
    secondesPassees++;

    const minutes=Math.floor(secondesPassees/60);
    const secondes=secondesPassees % 60;

    zoneAffichage.textContent=
      `Temps passé sur la page: ${minutes} min ${secondes} s`;
  }, 1000);
}

TempsPasse();
</script>
