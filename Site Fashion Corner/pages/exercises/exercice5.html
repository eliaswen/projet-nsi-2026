<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>MariolaStevanovic - JavaScript - Exercice5</title>
  <link rel="stylesheet" href="../../assets/css/exercices.css">
</head>

<body>
 <div class="exercice-wrapper">
  <h1>Exercice 5: il y a un "e"?</h1>

  <div class="boite">
    <p>
      Entre une chaîne de caractères 
      Le programme dira si elle contient la lettre "e"
    </p>

    <p>
      <label>Texte:</label>
      <input type="text" id="texte">
    </p>

    <button onclick="verifier()">Vérifier</button>

    <div class="rst" id="res">
      Résultat:
    </div>
  </div>
  <a href="exercices.html" class="home-btn">Retour a la page des exercices</a>
 </div>
  <script>
    function contiente(chaine){
      for (let i= 0; i<chaine.length; i++){
        if (chaine[i] === "e"){
          return true;
        }
      }
      return false;
    }

    function verifier(){
      let texte= document.getElementById("texte").value;
      let resultat=contiente(texte);
      if (resultat === true){
        document.getElementById("res").textContent=
        "Résultat : Il y a au moins un 'e'.";
      }
      else{
        document.getElementById("res").textContent=
        "Résultat : Aucun 'e' trouvé.";
      }
    }
  </script>

</body>
</html>
