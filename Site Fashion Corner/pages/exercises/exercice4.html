<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>MariolaStevanovic - JavaScript - Exercice4</title>
  <link rel="stylesheet" href="../../assets/css/exercices.css">
</head>

<body>
 <div class="exercice-wrapper">
  <h1>Exercice 4: deviner un nombre</h1>

  <div class="boite">
    <p>
      L'ordinateur choisit un nombre entre 1 et 100  
      Essaie de le deviner
    </p>

    <button onclick="nouvellePartie()">Nouvelle partie</button>

    <p>
      <label>Proposition :</label>
      <input type="number" id="essai">
    </p>

    <button onclick="verifier()">Vérifier</button>

    <div class="rst" id="res">
      Clique sur "Nouvelle partie".
    </div>
  </div>
  <a href="exercices.html" class="home-btn">Retour a la page des exercices</a>
 </div>
  <script>
    let nombreSecret= 0;
    let essais=0;

    function nouvellePartie(){
      nombreSecret=Math.floor(Math.random()*100)+1;
      essais=0;

      document.getElementById("res").textContent=
      "Je pense à un nombre entre 1 et 100.";
    }

    function verifier(){

      let proposition=Number(document.getElementById("essai").value);

      if (proposition<1 || proposition > 100){
        document.getElementById("res").textContent=
        "Entre un nombre entre 1 et 100.";
        return;
      }

      essais = essais + 1;

      if (proposition < nombreSecret){
        document.getElementById("res").textContent =
        "Plus grand ! (Essais : " + essais + ")";
      }
      else if (proposition > nombreSecret){
        document.getElementById("res").textContent =
        "Plus petit ! (Essais : " + essais + ")";
      }
      else{
        document.getElementById("res").textContent =
        "Bravo ! Trouvé en " + essais + " essais.";
      }
    }
  </script>

</body>
</html>
