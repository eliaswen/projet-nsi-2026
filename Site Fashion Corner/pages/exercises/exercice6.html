<body>
 <div class="exercice-wrapper">
  <h1>Exercice 6: quiz javascript</h1>

  <div class="boite">

    <p><strong>Q1 Vrai ou Faux :</strong><br>
    JavaScript s'exécute dans le navigateur</p>

    <input type="radio" name="q1" value="vrai"> Vrai
    <input type="radio" name="q1" value="faux"> Faux

    <hr>

    <p><strong>Q2 QCM :</strong><br>
    Quel mot-clé sert à déclarer une variable ?</p>

    <select id="q2">
      <option value="">-- Choisir --</option>
      <option value="if">if</option>
      <option value="let">let</option>
  
      <option value="for">for</option>
      <option value="html">html</option>
    </select>





    <hr>

    <p><strong>Q3 Question ouverte :</strong><br>
    Quelle fonction permet d'afficher une boîte de dialogue avec un champ à remplir ?</p>

    <input type="text" id="q3">
    <br><br>
    <button onclick="corriger()">Valider</button>
    <div class="rst" id="res">
      Score: 
    </div>





  </div>
  <a href="exercices.html" class="home-btn">Retour a la page des exercices</a>
 </div>
  <script>
    let dejaValide =false;
    function corriger(){

      if (dejaValide=== true){
        document.getElementById("res").textContent=
        "Quiz déjà validé.";
        return;
      }
      let score=0;
    let q1=document.querySelector('input[name="q1"]:checked');
      if (q1 && q1.value=== "vrai"){
        score =score + 1;
      }
      let q2= document.getElementById("q2").value;
      if (q2 === "let"){
        score= score + 1;
      }
      let q3= document.getElementById("q3").value.toLowerCase();
      if (q3=== "prompt()"||q3 === "prompt"){
        score= score + 1;
      }
    document.getElementById("res").textContent=
      "Score final:"+score+"/ 3";
      dejaValide=true;
    }
  </script>

</body>
</html>
