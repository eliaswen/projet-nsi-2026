<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>MariolaStevanovic - JavaScript - Exercice7</title>
  <link rel="stylesheet" href="exercices.css">
</head>

<body>
 <div class="exercice-wrapper">
  <h1>Exercice 7: modifier le style d'une liste</h1>

  <div class="boite">

    <h3>Les métiers du web</h3>

    <ul id="liste">
      <li>Développeur</li>
      <li>Chef de projet</li>
      <li>Web designer</li>
      <li>Développeur mobile</li>
      <li>Référenceur SEO</li>
    </ul>

    <button onclick="changerStyle()">Changer la couleur</button>

    <div class="rst" id="res">
      Style normal.
    </div>

  </div>
  <a href="exercices.html" class="home-btn">Retour a la page des exercices</a>
 </div>
  <script>

    let actif=false;

    function changerStyle(){
      let liste= document.getElementById("liste");
      if (actif === false){
        liste.style.color= "blue";
        liste.style.fontWeight ="bold";
        liste.style.backgroundColor ="#eef4ff";

        document.getElementById("res").textContent=
        "Style modifié.";
        actif = true;
      }
      else{
        liste.style.color ="black";
        liste.style.fontWeight ="normal";
        liste.style.backgroundColor= "transparent";
        document.getElementById("res").textContent=
        "Style normal.";
        actif = false;
      }
    }

  </script>

</body>
</html>
