<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>MariolaStevanovic - JavaScript - Exercice9</title>
  <link rel="stylesheet" href="exercices.css">
</head>

<body>
 <div class="exercice-wrapper">
  <h1>Exercice 9: Modifier la couleur de fond</h1>
  <div class="boite">
    <p>Choisissez une couleur :</p>

    <button onclick="changerCouleur('#ffff00')">Jaune</button>
    <button onclick="changerCouleur('#00cc00')">Vert</button>
    <button onclick="changerCouleur('#8a2be2')">Violet</button>
    <div class="rst" id="res">
      Couleur choisie:
    </div>



  </div>
  <a href="exercices.html" class="home-btn">Retour a la page des exercices</a>
 </div>
<script>
  function changerCouleur(code){
    document.body.style.backgroundColor= code;
    document.getElementById("res").textContent=
    "Couleur choisie : "+ code;
}
</script>

</body>
</html>
